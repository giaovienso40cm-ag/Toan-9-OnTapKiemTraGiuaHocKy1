<style>
    :root {
        --bg-1: #050816;
        --bg-2: #0b1228;
        --text: #f8fafc;
        --cyan: #22d3ee;
        --blue: #3b82f6;
        --violet: #a78bfa;
        --pink: #f472b6;
        --yellow: #facc15;
        --green: #34d399;
        --red: #fb7185;
        --orange: #fb923c;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
        color: var(--text);
        font-family: "Segoe UI", "Inter", Arial, sans-serif;
        font-size: 150%;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        background:
            radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.18), transparent 25%),
            radial-gradient(circle at 88% 15%, rgba(167, 139, 250, 0.20), transparent 28%),
            radial-gradient(circle at 78% 82%, rgba(244, 114, 182, 0.16), transparent 24%),
            linear-gradient(145deg, var(--bg-1) 0%, #071126 48%, var(--bg-2) 100%);
        background-attachment: fixed;
    }

    body::before, body::after {
        content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(18px); opacity: 0.6; pointer-events: none;
    }
    body::before {
        width: 260px; height: 260px; top: 12%; left: -90px;
        background: linear-gradient(135deg, rgba(34,211,238,.22), rgba(96,165,250,.08));
    }
    body::after {
        width: 330px; height: 330px; right: -120px; bottom: 4%;
        background: linear-gradient(135deg, rgba(244,114,182,.18), rgba(167,139,250,.18));
    }

    .header-fixed {
        position: sticky; top: 0; width: 100%; z-index: 1000; text-align: center;
        padding: 14px 14px 10px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.6px;
        color: #ffffff; background: linear-gradient(90deg, rgba(8,15,35,.96), rgba(24,33,65,.96), rgba(8,15,35,.96));
        border-bottom: 1px solid rgba(96, 165, 250, 0.35); box-shadow: 0 8px 30px rgba(0,0,0,.35);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .header-fixed::after {
        content: ""; position: absolute; left: 12%; right: 12%; bottom: -2px; height: 3px; border-radius: 999px;
        background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet), var(--pink), var(--yellow));
        box-shadow: 0 0 18px rgba(96,165,250,.6);
    }
    .info-bar {
        width: min(980px, 94%); margin: 8px auto 0; padding: 8px 14px; font-size: 0.68em; font-weight: 700;
        color: #e2e8f0; background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(34, 211, 238, 0.28);
        border-radius: 999px; box-shadow: inset 0 0 20px rgba(34,211,238,.05); text-transform: none; letter-spacing: 0;
    }

    #quiz-app { width: 95%; max-width: 920px; padding: 26px 18px 44px; }
    .screen { display: none; }
    .active { display: block; animation: fadeUp .45s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .welcome-box, #quiz-screen, #review-screen {
        position: relative; overflow: hidden; border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 26px;
        background: linear-gradient(145deg, rgba(15,23,42,.88), rgba(17,28,54,.72));
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .welcome-box::before, #quiz-screen::before, #review-screen::before {
        content: ""; position: absolute; inset: 0; padding: 1px; border-radius: inherit;
        background: linear-gradient(135deg, rgba(34,211,238,.65), rgba(167,139,250,.32), rgba(244,114,182,.52));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    
    .welcome-box { padding: 36px; text-align: center; margin-top: 26px; }
    #review-screen { padding: 30px; margin-top: 26px; }

    .welcome-box h2, #result-screen h2 {
        margin-top: 0; color: transparent !important;
        background: linear-gradient(90deg, var(--cyan), var(--yellow), var(--pink));
        -webkit-background-clip: text; background-clip: text; letter-spacing: .5px;
    }

    label { display: block; margin-top: 12px; color: #e2e8f0; font-weight: 700; text-align: left; }
    input[type="text"], select {
        width: 100%; padding: 15px 16px; margin: 9px 0 14px; font-size: 1.05rem; color: #f8fafc;
        background: rgba(2, 6, 23, 0.85); border: 1px solid rgba(96,165,250,.34); border-radius: 14px;
        outline: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.02); transition: .25s ease; cursor: pointer;
    }
    select option { background: #0b1228; color: #f8fafc; padding: 10px; }
    input[type="text"]:focus, select:focus {
        border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(34,211,238,.12), 0 0 24px rgba(34,211,238,.12); transform: translateY(-1px);
    }

    #quiz-screen { padding: 28px; margin-top: 22px; }
    #q-text {
        position: relative; margin-bottom: 14px !important; padding: 18px 20px; border-radius: 18px; color: #ffffff;
        background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(139,92,246,.12));
        border: 1px solid rgba(96,165,250,.28); box-shadow: inset 0 0 28px rgba(96,165,250,.05);
        line-height: 1.55; display: flex; align-items: center; gap: 16px; font-weight: bold;
    }
    #q-text > p { margin: 0; flex: 1; min-width: 0; }
    #q-text::before {
        content: "✦"; display: grid; place-items: center; width: 52px; height: 52px; min-width: 52px; flex: 0 0 52px;
        margin-right: 0; border-radius: 14px; color: #08111f; background: linear-gradient(135deg, var(--cyan), var(--yellow));
        box-shadow: 0 0 20px rgba(34,211,238,.22);
    }
    #q-media { margin: 10px 0 18px; text-align: center; }
    #q-media svg { display: block; margin: 0 auto; max-width: 100%; height: auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.25)); }

    /* Multiple Choice Options */
    .option {
        position: relative; overflow: hidden; padding: 15px 20px; margin: 14px 0; border-radius: 16px; cursor: pointer;
        transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
        background: rgba(15, 23, 42, 0.72); border: 1px solid rgba(148, 163, 184, 0.28);
        display: flex; align-items: center; min-height: 64px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .option::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 16px 0 0 16px; background: #64748b; }
    .option:hover { background: rgba(30, 41, 59, 0.88); border-color: rgba(125, 211, 252, 0.55); box-shadow: 0 12px 34px rgba(0,0,0,.22), 0 0 22px rgba(96,165,250,.10); }
    .option.selected { background: rgba(34, 211, 238, 0.15) !important; border-color: var(--cyan) !important; box-shadow: 0 0 15px rgba(34,211,238,.3) !important; transform: translateY(-2px) scale(1.012); }
    .option.selected::after { background: var(--cyan) !important; }

    /* True/False Options */
    .tf-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .tf-table td { padding: 12px; border: 1px solid rgba(148, 163, 184, 0.28); font-size: 0.95em;}
    .tf-btn {
        padding: 8px 16px; margin: 0 5px; border-radius: 8px; cursor: pointer;
        background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(96,165,250,.3);
        color: #f8fafc; font-weight: bold; transition: .2s; width: 100%; min-width: 60px;
    }
    .tf-btn:hover { background: rgba(59, 130, 246, 0.4); }
    .tf-btn.selected { background: var(--cyan); color: #050816; box-shadow: 0 0 15px rgba(34,211,238,.4); border-color: var(--cyan); }

    /* Short Answer Input */
    .sa-input {
        width: 100%; padding: 18px; margin-top: 10px; font-size: 1.15rem; background: rgba(2, 6, 23, 0.85); 
        border: 2px solid rgba(96,165,250,.5); border-radius: 14px; color: var(--yellow); outline: none; font-weight: bold;
    }
    .sa-input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(34,211,238,.25); }

    .btn-main {
        width: fit-content; min-width: 210px; padding: 14px 28px; margin: 22px auto; display: block;
        border: 1px solid rgba(255,255,255,.16); border-radius: 15px; color: #07111f;
        background: linear-gradient(90deg, var(--cyan), #93c5fd, var(--violet));
        font-size: 1.08rem; font-weight: 900; letter-spacing: .2px; cursor: pointer;
        box-shadow: 0 10px 28px rgba(59,130,246,.24), inset 0 1px 0 rgba(255,255,255,.55);
        transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }
    .btn-main:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 34px rgba(96,165,250,.30), 0 0 20px rgba(167,139,250,.18); filter: brightness(1.06); }
    .btn-main:active { transform: translateY(0) scale(.99); }

    /* Nút Câu Tiếp Theo nổi bật */
    #btn-next {
        background: linear-gradient(90deg, #3b82f6, #06b6d4) !important;
        color: #ffffff !important;
        text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.4) !important;
        box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4) !important;
    }
    #submit-btn { background: linear-gradient(90deg, var(--green), var(--cyan)); color: #05251d; }

    #final-score {
        display: inline-block; min-width: 180px; padding: 14px 22px; border-radius: 18px; color: var(--yellow);
        background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.28); box-shadow: 0 0 26px rgba(250,204,21,.08); font-weight: 900;
    }

    mjx-container { color: #ffffff; }
    #q-text mjx-container:not([display="true"]), .option mjx-container:not([display="true"]) { margin-left: 0.16em !important; margin-right: 0.16em !important; }

    @media (max-width: 680px) {
        body { font-size: 122%; }
        .header-fixed { padding: 11px 8px 8px; font-size: .96em; }
        #quiz-app { width: 100%; padding: 14px 10px 34px; }
        .welcome-box, #quiz-screen, #review-screen { border-radius: 20px; }
        .welcome-box, #review-screen { padding: 24px 18px; }
        #quiz-screen { padding: 18px 13px; }
        #q-text { padding: 15px; gap: 10px; }
        #q-text::before { width: 40px; height: 40px; min-width: 40px; flex-basis: 40px; border-radius: 11px; }
        .option { padding: 14px 14px 14px 18px; min-height: 58px; border-radius: 14px; }
        .btn-main { width: 100%; min-width: 0; max-width: 420px; font-size: 1rem; }
        .tf-table td { padding: 8px; font-size: 0.85em; }
        .tf-btn { padding: 8px 10px; margin: 0 2px; }
    }
</style>
</head>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzW_EMVRos1niOBXBC_6YTJDsftWJbfp2OIUeJuEI5zShBw491IV-hZk5l6prJrFkw/exec";

    const DB = [

      { type: "mc", q: "Câu 1: Trong các phương trình sau, phương trình nào là phương trình bậc nhất hai ẩn $x$ và $y$?", a: ["A. $2x^{2}+y=3$.", "B. $2x-3y=5$.", "C. $0x+0y=4$.", "D. $3x-\\frac{2}{y}=1$."], c: 1 },
      { type: "mc", q: "Câu 2: Cặp số $(x; y)$ nào sau đây là một nghiệm của phương trình $3x-2y=7$?", a: ["A. $(2;-1)$.", "B. $(1;-2)$.", "C. $(3;1)$.", "D. $(3;-1)$."], c: 1 },
      { type: "mc", q: "Câu 3: Nghiệm của hệ phương trình $\\begin{cases}x+y=4\\\\ 2x-y=5\\end{cases}$ là:", a: ["A. $(3;1)$.", "B. $(1;3)$.", "C. $(2;2)$.", "D. $(4;0)$."], c: 0 },
      { type: "mc", q: "Câu 4: Hệ phương trình $\\begin{cases}2x-y=1\\\\ 4x-2y=5\\end{cases}$ có bao nhiêu nghiệm?", a: ["A. Có 1 nghiệm duy nhất.", "B. Vô nghiệm.", "C. Có vô số nghiệm.", "D. Có 2 nghiệm."], c: 1 },
      { type: "mc", q: "Câu 5: Trong các hệ phương trình dưới đây, hệ phương trình nào là hệ hai phương trình bậc nhất hai ẩn?", a: ["A. $\\begin{cases}x^{2}-2y=0\\\\ 2x+3y=1.\\end{cases}$", "B. $\\begin{cases}x-2y=0\\\\ 2x+3y=1.\\end{cases}$", "C. $\\begin{cases}x-2y^{2}=0\\\\ 2x+3y=1.\\end{cases}$", "D. $\\begin{cases}x^{2}-2y=0\\\\ 2x+3y^{2}=1.\\end{cases}$"], c: 1 },
      { type: "mc", q: "Câu 6: Một ô tô đi từ A đến B rồi quay về A hết tổng cộng 5 giờ. Nếu gọi thời gian đi là $x$ (giờ) và thời gian về là $y$ (giờ) thì phương trình thứ nhất là:", a: ["A. $x-y=5$.", "B. $x+y=5$.", "C. $xy=5$.", "D. $\\frac{x}{y}=5$."], c: 1 },
      { type: "mc", q: "Câu 7: Điều kiện xác định của phương trình $\\frac{x+1}{x-2}+3=0$ là:", a: ["A. $x\\ne 0$.", "B. $x\\ne -2$.", "C. $x\\ne -1$.", "D. $x\\ne 2$."], c: 3 },
      { type: "mc", q: "Câu 8: Nghiệm của phương trình tích $(2x-4)(x+3)=0$ là:", a: ["A. $x=2$ hoặc $x=3$.", "B. $x=-2$ hoặc $x=3$.", "C. $x=2$ hoặc $x=-3$.", "D. $x=-2$ hoặc $x=-3$."], c: 2 },
      { type: "mc", q: "Câu 9: Cho $a>b$. Kết luận nào sau đây không đúng?", a: ["A. $2a>2b$.", "B. $-a<-b$.", "C. $a-b>0$.", "D. $-b<0$."], c: 3 },
      { type: "mc", q: "Câu 10: Nếu $a\\ge b$ thì", a: ["A. $a+3\\le b+3$", "B. $a+3 < b+3$", "C. $a+3>b+3$", "D. $a+3\\ge b+3$"], c: 3 },
      { type: "mc", q: "Câu 11: Bất phương trình nào sau đây không phải là bất phương trình bậc nhất một ẩn?", a: ["A. $-x+2>0$", "B. $\\sqrt{2}-3x>0$", "C. $5y-x+1>0$", "D. $x+9\\le 0$"], c: 2 },
      { type: "mc", q: "Câu 12: Vế phải của bất đẳng thức $2x+3>5$ là:", a: ["A. $2x+3$.", "B. $5$.", "C. $2x-5$.", "D. $2x-2$."], c: 1 },
      { type: "mc", q: "Câu 13: Cho tam giác ABC vuông tại A có góc nhọn $B=\\alpha$ (hình vẽ). Tỉ số lượng giác $\\sin \\alpha$ được tính bằng:", image: "<svg width='200' height='160' viewBox='0 0 200 160' xmlns='http://www.w3.org/2000/svg'><g transform='translate(10, 10)'><polygon points='20,140 170,140 20,20' fill='none' stroke='#22d3ee' stroke-width='2' stroke-linejoin='round'/><rect x='20' y='125' width='15' height='15' fill='none' stroke='#22d3ee' stroke-width='1.5'/><path d='M 145 140 A 25 25 0 0 1 151 125' fill='none' stroke='#facc15' stroke-width='2'/><text x='125' y='132' fill='#facc15' font-family='sans-serif' font-size='18' font-style='italic' font-weight='bold'>α</text><text x='5' y='155' fill='#f8fafc' font-family='sans-serif' font-size='18' font-weight='bold'>A</text><text x='175' y='155' fill='#f8fafc' font-family='sans-serif' font-size='18' font-weight='bold'>B</text><text x='15' y='10' fill='#f8fafc' font-family='sans-serif' font-size='18' font-weight='bold'>C</text></g></svg>", a: ["A. $\\sin \\alpha=\\frac{AB}{AC}$", "B. $\\sin \\alpha=\\frac{AB}{BC}$", "C. $\\sin \\alpha=\\frac{AC}{AB}$", "D. $\\sin \\alpha=\\frac{AC}{BC}$"], c: 3 },
      { type: "mc", q: "Câu 14: Cho biết $\\sin 30^{\\circ}=\\frac{1}{2}$. Khi đó $\\cos 60^{\\circ}$ bằng:", a: ["A. $\\frac{\\sqrt{3}}{2}$", "B. $\\frac{1}{2}$", "C. $\\frac{\\sqrt{2}}{2}$", "D. $1$"], c: 1 },
      { type: "mc", q: "Câu 15: Giá trị của $\\tan 45^{\\circ}$ bằng:", a: ["A. $\\frac{1}{\\sqrt{3}}$", "B. $\\sqrt{3}$", "C. $1$", "D. $0$"], c: 2 },
      { type: "mc", q: "Câu 16: Một cái thang dài 4 m đặt dựa vào tường, góc tạo bởi thang và mặt đất là 60° (hình vẽ). Chiều cao của điểm tựa thang trên tường là:", image: "<svg width='200' height='180' viewBox='0 0 200 180' xmlns='http://www.w3.org/2000/svg'><g transform='translate(10, 10)'><line x1='0' y1='160' x2='180' y2='160' stroke='#64748b' stroke-width='3'/><polygon points='40,160 140,160 40,20' fill='none' stroke='#34d399' stroke-width='2' stroke-linejoin='round'/><rect x='40' y='145' width='15' height='15' fill='none' stroke='#34d399' stroke-width='1.5'/><line x1='40' y1='20' x2='140' y2='160' stroke='#3b82f6' stroke-width='4'/><path d='M 115 160 A 25 25 0 0 1 125 139' fill='none' stroke='#fb7185' stroke-width='2'/><text x='75' y='155' fill='#fb7185' font-family='sans-serif' font-size='16' font-weight='bold'>60°</text><text x='95' y='80' fill='#60a5fa' font-family='sans-serif' font-size='16' transform='rotate(54 95 80)' font-weight='bold'>4 m</text><text x='25' y='175' fill='#f8fafc' font-family='sans-serif' font-size='18' font-weight='bold'>C</text><text x='145' y='175' fill='#f8fafc' font-family='sans-serif' font-size='18' font-weight='bold'>B</text><text x='25' y='10' fill='#f8fafc' font-family='sans-serif' font-size='18' font-weight='bold'>A</text></g></svg>", a: ["A. $2\\sqrt{3}\\text{ m}$", "B. $2\\sqrt{2}\\text{ m}$", "C. $4\\text{ m}$", "D. $3\\text{ m}$"], c: 0 },
      { type: "tf", q: "Câu 17: Xét tính Đúng / Sai của các khẳng định sau về phương trình bậc nhất hai ẩn $ax+by=c$ ($a,b$ không đồng thời bằng 0)", stmts: ["a) Phương trình bậc nhất hai ẩn luôn có vô số nghiệm.", "b) Cặp số $(0;0)$ luôn là nghiệm của phương trình $ax+by=c$ với mọi $c$.", "c) Biểu diễn hình học tập nghiệm của phương trình là một đường thẳng.", "d) Phương trình $0x+2y=4$ có đường thẳng biểu diễn nghiệm song song với trục hoành."], c: ["Đ", "S", "Đ", "Đ"] },
      { type: "tf", q: "Câu 18: Xét tính Đúng / Sai của các khẳng định sau về tỉ số lượng giác của hai góc phụ nhau", stmts: ["a) Nếu $\\alpha+\\beta=90^{\\circ}$ thì $\\sin \\alpha=\\cos \\beta$.", "b) Nếu $\\alpha+\\beta=90^{\\circ}$ thì $\\tan \\alpha=\\cot \\beta$.", "c) $\\sin 20^{\\circ}=\\cos 70^{\\circ}$.", "d) $\\tan 35^{\\circ}\\cdot \\tan 55^{\\circ}=1$."], c: ["Đ", "Đ", "Đ", "Đ"] },
      { type: "sa", q: "Câu 19: Giải hệ phương trình $\\begin{cases}2x+y=7\\\\ x-y=2\\end{cases}$. Tính giá trị biểu thức $x+y$.", c: ["4"] },
      { type: "sa", q: "Câu 20: Giải phương trình tích $(2x-3)(x+5)=0$. Tính tổng các nghiệm của phương trình.", c: ["-3.5", "-3,5", "-7/2"] }
    ];

    let current = 0, earnedPoints = 0;
    let sName = "", sClass = "";
    let quizInProgress = false;
    let leaveWarningPending = false;
    let quizStartTime = null, quizEndTime = null, timerInterval = null;
    let userAnswers = []; 

    function getElapsedSeconds() {
        if (!quizStartTime) return 0;
        const end = quizEndTime || Date.now();
        return Math.max(0, Math.floor((end - quizStartTime) / 1000));
    }
    function formatDurationClock(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600), minutes = Math.floor((totalSeconds % 3600) / 60), seconds = totalSeconds % 60;
        if (hours > 0) return String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }
    function formatDurationText(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600), minutes = Math.floor((totalSeconds % 3600) / 60), seconds = totalSeconds % 60;
        const parts = [];
        if (hours > 0) parts.push(hours + " giờ");
        if (minutes > 0) parts.push(minutes + " phút");
        parts.push(seconds + " giây");
        return parts.join(" ");
    }
    function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(updateHeader, 1000); }
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

    function startQuiz() {
        sName = document.getElementById('student-select').value;
        sClass = document.getElementById('class-input').value.trim();
        if (!sName) return alert("Em hãy chọn tên của mình từ danh sách nhé!");
        if (!sClass) return alert("Em hãy nhập lớp nhé!");

        quizInProgress = true; leaveWarningPending = false; quizStartTime = Date.now(); quizEndTime = null;
        userAnswers = new Array(DB.length).fill(null);
        startTimer(); updateHeader();
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        renderQuestion();
    }

    function updateHeader() {
        document.getElementById('student-header').innerText = `${sName}. Lớp: ${sClass}. Thời gian: ${formatDurationClock(getElapsedSeconds())}.`;
    }

    function renderQuestion() {
        const item = DB[current];
        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('q-text').innerHTML = `<p>${item.q}</p>`;
        document.getElementById('q-media').innerHTML = item.image ? item.image : "";
        const opts = document.getElementById('options-area');
        opts.innerHTML = "";

        if (item.type === 'mc') {
            item.a.forEach((text, i) => {
                const d = document.createElement('div');
                d.className = 'option';
                if (userAnswers[current] === i) { d.classList.add('selected'); document.getElementById('btn-next').style.display = 'block'; }
                d.innerHTML = `<strong>${text.substring(0,2)}</strong> ${text.substring(3)}`;
                d.onclick = () => selectMC(i, d);
                opts.appendChild(d);
            });
        } else if (item.type === 'tf') {
            let table = `<table class="tf-table">`;
            item.stmts.forEach((stmt, i) => {
                let ans = userAnswers[current] ? userAnswers[current][i] : null;
                let dClass = ans === 'Đ' ? 'selected' : '';
                let sClass = ans === 'S' ? 'selected' : '';
                table += `<tr>
                    <td style="width: 70%;">${stmt}</td>
                    <td style="text-align: center; width: 15%;"><button class="tf-btn ${dClass}" onclick="selectTF(${i}, 'Đ', this)">ĐÚNG</button></td>
                    <td style="text-align: center; width: 15%;"><button class="tf-btn ${sClass}" onclick="selectTF(${i}, 'S', this)">SAI</button></td>
                </tr>`;
            });
            table += `</table>`;
            opts.innerHTML = table;
            if (userAnswers[current] && Object.keys(userAnswers[current]).length === item.stmts.length) {
                document.getElementById('btn-next').style.display = 'block';
            }
        } else if (item.type === 'sa') {
            let val = userAnswers[current] || '';
            opts.innerHTML = `<input type="text" class="sa-input" placeholder="Nhập đáp án của em vào đây..." value="${val}" oninput="inputSA(this.value)">`;
            if (val.trim() !== '') document.getElementById('btn-next').style.display = 'block';
        }
        MathJax.typesetPromise();
    }

    function selectMC(idx, el) {
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        userAnswers[current] = idx;
        document.getElementById('btn-next').style.display = 'block';
    }

    function selectTF(stmtIdx, val, el) {
        const row = el.closest('tr');
        row.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('selected'));
        el.classList.add('selected');
        if (!userAnswers[current]) userAnswers[current] = [];
        userAnswers[current][stmtIdx] = val;
        if (Object.keys(userAnswers[current]).length === DB[current].stmts.length) {
             document.getElementById('btn-next').style.display = 'block';
        }
    }

    function inputSA(val) {
        userAnswers[current] = val.trim();
        if (val.trim() !== "") document.getElementById('btn-next').style.display = 'block';
        else document.getElementById('btn-next').style.display = 'none';
    }

    function calculateTotalScore() {
        earnedPoints = 0;
        DB.forEach((item, i) => {
            const ans = userAnswers[i];
            if (item.type === 'mc') {
                if (ans === item.c) earnedPoints += 0.5; 
            } else if (item.type === 'tf') {
                if (ans) {
                    let cCount = 0;
                    for (let j=0; j<4; j++) { if (ans[j] === item.c[j]) cCount++; }
                    earnedPoints += cCount * 0.125;
                }
            } else if (item.type === 'sa') {
                if (ans) {
                    let cleanAns = ans.replace(/\s+/g, '').replace(',', '.');
                    if (item.c.includes(cleanAns)) earnedPoints += 0.5;
                }
            }
        });
        earnedPoints = Math.round(earnedPoints * 100) / 100;
    }

    function goNext() {
        current++;
        if (current < DB.length) {
            renderQuestion();
        } else {
            quizEndTime = Date.now(); stopTimer(); quizInProgress = false; leaveWarningPending = false;
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
        }
    }

    function submitScore() {
        const status = document.getElementById('status-text');
        const submitBtn = document.getElementById('submit-btn');
        if (SCRIPT_URL.includes("DÁN_LINK")) return alert("Thầy/Cô chưa dán link Apps Script để gửi điểm!");

        submitBtn.disabled = true; submitBtn.innerText = "ĐANG GỬI DỮ LIỆU..."; submitBtn.style.opacity = "0.6"; submitBtn.style.cursor = "not-allowed";
        status.innerText = "Đang kết nối hệ thống...";

        calculateTotalScore();

        const payload = {
            name: sName, class: sClass, score: earnedPoints, attempts: 1, duration: formatDurationText(getElapsedSeconds()), durationSeconds: getElapsedSeconds(), quizId: "GiuaKy1_Toan9"
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        }).then(() => {
            status.innerText = "";
            document.getElementById('pre-submit-msg').style.display = 'none';
            document.getElementById('result-title').innerText = "KẾT QUẢ BÀI LÀM";
            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = `Điểm của em: ${earnedPoints} / 10`;
            document.getElementById('final-time').innerText = `⏱ Thời gian: ${formatDurationText(getElapsedSeconds())}`;
            document.getElementById('thanks-container').innerText = "Thầy/Cô đã nhận được bài của em!";
            submitBtn.style.display = 'none';
            document.getElementById('review-btn').style.display = 'block';
        }).catch(() => {
            status.innerText = "Lỗi mạng khi nộp bài! Em hãy kiểm tra kết nối và thử lại nhé.";
            submitBtn.disabled = false; submitBtn.innerText = "NỘP BÀI LÊN HỆ THỐNG"; submitBtn.style.opacity = "1"; submitBtn.style.cursor = "pointer";
        });
    }

    function showReview() {
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('review-screen').classList.add('active');
        const container = document.getElementById('review-container');
        container.innerHTML = "";

        DB.forEach((item, i) => {
            const ans = userAnswers[i];
            let html = `<div style="margin-bottom: 25px; padding: 20px; background: rgba(15,23,42,0.7); border-radius: 18px; border: 1px solid rgba(96,165,250,0.25); text-align: left;">`;
            
            // Xử lý báo đúng/sai chung cho MC và SA
            let isCorrect = false;
            let resultIcon = "";
            
            if (item.type === 'mc') {
                isCorrect = (ans === item.c);
                resultIcon = isCorrect ? `<span style="color: var(--green);">[✅ Làm đúng]</span>` : `<span style="color: var(--red);">[❌ Làm sai]</span>`;
            } else if (item.type === 'sa') {
                if (ans) {
                    let cleanAns = ans.replace(/\s+/g, '').replace(',', '.');
                    isCorrect = item.c.includes(cleanAns);
                }
                resultIcon = isCorrect ? `<span style="color: var(--green);">[✅ Làm đúng]</span>` : `<span style="color: var(--red);">[❌ Làm sai]</span>`;
            }

            // In câu hỏi
            if (item.type === 'tf') {
                html += `<p style="color: var(--cyan); font-weight: bold; margin-top:0;">${item.q}</p>`;
            } else {
                html += `<p style="color: var(--cyan); font-weight: bold; margin-top:0;">${item.q} ${resultIcon}</p>`;
            }

            if (item.image) html += `<div style="text-align:center; margin: 15px 0;">${item.image}</div>`;

            if (item.type === 'mc') {
                item.a.forEach((opt, idx) => {
                    let sel = (ans === idx) ? "color: var(--yellow); font-weight: bold;" : "color: #64748b;";
                    let icon = (ans === idx) ? "☑" : "☐";
                    html += `<div style="${sel}; padding: 6px 0;">${icon} ${opt}</div>`;
                });
            } else if (item.type === 'tf') {
                item.stmts.forEach((stmt, idx) => {
                    let uVal = ans ? ans[idx] : "Chưa chọn";
                    let tIcon = "";
                    if (ans && uVal !== "Chưa chọn") {
                        if (uVal === item.c[idx]) tIcon = `<span style="color: var(--green);">[✅ Đúng]</span>`;
                        else tIcon = `<span style="color: var(--red);">[❌ Sai]</span>`;
                    }
                    html += `<div style="color: #cbd5e1; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">${stmt} <br> <span style="color: var(--yellow);">=> Đã chọn: ${uVal}</span> ${tIcon}</div>`;
                });
            } else if (item.type === 'sa') {
                html += `<div style="color: #cbd5e1; padding: 6px 0;">Đã điền: <span style="color: var(--yellow); font-weight: bold;">${ans || "(Để trống)"}</span></div>`;
            }
            html += `</div>`;
            container.innerHTML += html;
        });
        MathJax.typesetPromise();
    }

    window.addEventListener("beforeunload", function (event) {
        if (!quizInProgress) return;
        event.preventDefault(); event.returnValue = "";
    });

    document.addEventListener("visibilitychange", function () {
        if (!quizInProgress) return;
        if (document.hidden) { leaveWarningPending = true; } 
        else if (leaveWarningPending) {
            leaveWarningPending = false;
            setTimeout(function () { alert("⚠️ CẢNH BÁO: Em vừa rời khỏi màn hình làm bài. Hãy tập trung làm bài thi!"); }, 120);
        }
    });
</script>
</body>
